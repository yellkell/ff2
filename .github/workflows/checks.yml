name: Checks

# Typecheck, build, and prove the security rules actually say what they look
# like they say.
#
# The rules check runs HERE rather than being something you remember to run,
# because it needs the Firestore emulator and the emulator needs a JDK 21+ that
# a dev machine may not have. CI has one, so the suite runs on every push and a
# rule that stops holding is a red tick rather than a discovery.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator refuses anything below 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools
      - name: Prove the rules
        run: npm run check:rules
