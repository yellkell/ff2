name: Deploy to Firebase Hosting

# Builds FIRE FIGHT 2 and publishes dist/ to https://ff2.web.app.
# Pushes to main go LIVE; pull requests get an ephemeral preview channel so a
# change can be walked around in a headset before it is merged.
#
# THIS FILE WAS PARKED ON MANUAL DISPATCH until FF2 had its own Firebase
# project, because it pointed at arfi-b68f9 — which is FIRE FIGHT 1's LIVE
# hosting, and an automatic deploy from this repo would have overwritten the
# live FF1 site. FF2 has its own home now (the project behind ff2.web.app), so
# the handbrake comes off.
#
# ONE-TIME SETUP: the repo secret FIREBASE_SERVICE_ACCOUNT must hold the JSON
# key of a service account ON THE FF2 PROJECT with the "Firebase Hosting Admin"
# role. If that secret still holds an arfi-b68f9 key from the FF1 era, REPLACE
# it — a key for the wrong project fails the deploy rather than doing anything
# dangerous, but it fails every time until it is swapped.
# (Firebase console → Project settings → Service accounts → Generate new
# private key, then paste the whole JSON into the secret.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Pushes to main → live channel; PRs → a temporary preview URL.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: flappy-ff9f6
          target: ff2
          channelId: ${{ github.ref == 'refs/heads/main' && 'live' || '' }}
